<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>GARUD DRISHTI — Citizen Field Mobile App</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: #0c1926;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Responsive Phone Wrapper: Fluid on small screens, neatly framed on desktop */
      .phone-wrapper {
        width: 100%;
        max-width: 430px;
        height: min(94vh, 900px);
        max-height: 100dvh;
        background: #F4F6F9;
        border-radius: 36px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 10px #1f2c39;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .phone-notch {
        width: 130px;
        height: 22px;
        background: #1f2c39;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
        z-index: 100;
        pointer-events: none;
      }

      #root {
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        flex: 1 1 auto !important;
        position: relative !important;
        overflow: hidden !important;
        background: #F4F6F9 !important;
      }

      #root > div {
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        flex: 1 1 auto !important;
      }

      /* Mobile Device Screen Breakpoints: Full viewport fluid responsiveness */
      @media (max-width: 540px), (max-height: 700px) {
        html, body {
          background: #F4F6F9;
          overflow: auto;
        }
        .phone-wrapper {
          width: 100% !important;
          max-width: 100% !important;
          height: 100% !important;
          height: 100dvh !important;
          max-height: 100% !important;
          max-height: 100dvh !important;
          border-radius: 0 !important;
          box-shadow: none !important;
        }
        .phone-notch {
          display: none !important;
        }
      }

      /* High-density & compact displays (e.g. iPhone SE, 320px - 360px) */
      @media (max-width: 360px) {
        body {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-wrapper">
      <div class="phone-notch"></div>
      <div id="root"></div>
    </div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
