version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://netra:netra_pass@db:5432/netra_gis
      - REDIS_URL=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml-service:5000
      - SMS_MODE=mock
    depends_on:
      - db
      - redis
      - ml-service

  ml-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ml
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://netra:netra_pass@db:5432/netra_gis
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../../models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - db
      - redis

  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_DB=netra_gis
      - POSTGRES_USER=netra
      - POSTGRES_PASSWORD=netra_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:

